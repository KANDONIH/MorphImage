[package]
name = "morphimage"
version = "0.1.0"
description = "Local multi-core image converter and compressor by Kando"
authors = ["Kando"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "morphimage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "avif"] }
resvg = "0.45"
psd = "0.3"
jxl-oxide = "0.11"
rawler = "0.6"
oxipng = { version = "9", default-features = false, features = ["filetime", "parallel", "zopfli"] }
kamadak-exif = "0.5"
webp = { version = "0.3", default-features = false }
exoquant = "0.2"
rayon = "1"
walkdir = "2"
tempfile = "3"
arboard = "3.4"
lopdf = "0.34"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
fast_image_resize = "5.1"
# "=" pins rc.9: caret would float to rc.15, whose API differs.
ort = { version = "=2.0.0-rc.9", features = ["download-binaries", "directml"] }
# native-tls = Windows SChannel: no C toolchain (rustls would pull aws-lc/ring).
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Verifies the downloaded model against a pinned hash.
sha2 = "0.10"
# f16 tensors for the fp16 BiRefNet model; same version ort already pulls in.
half = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi", "Win32_System_Performance"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
